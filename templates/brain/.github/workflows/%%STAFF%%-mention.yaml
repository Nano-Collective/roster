name: %%STAFF_UPPER%% on a mention

# Generated by roster. The body lives in %%OPS_REPO%%/.github/workflows/session.yaml.
#
# "%%MENTION%% ..." in a comment on this tracker, or in the body of a new issue, wakes a focused
# run in about 30 seconds. So does another staff member filing an issue here with their
# `from-<handle>` label. It is a task, not a session: no boot ritual, no handoff, and the reply
# goes in the thread.
#
# NOTE: %%TOKENS%% are filled by `roster hire`. GitHub's own ${{ }} expressions are left alone.

# What the run is and what started it, as the Actions list shows it. The portal reads this back
# to link a live run to the request behind it, and the daily limit counts peer runs by it.
run-name: >-
  %%STAFF%% ${{ contains(fromJSON('%%HUMAN_LOGINS%%'), github.event.sender.login) && 'mention' || 'peer' }}
  #${{ github.event.issue.number }}

on:
  # A mention in the body of a brand new issue, which is often the faster route: one box, rather
  # than a "create, then comment" round trip. `edited` doubles as the way to re-ask without
  # opening a second issue.
  issues:
    types: [opened, edited]

  # `edited` is the re-run handle. A re-run from the Actions tab is pinned to the workflow file as
  # it was when the run started, so it can never pick up a fix, and deleting and reposting a
  # comment loses its attachments. Editing fires a fresh event against the default branch's
  # current file with the comment and its uploads intact.
  issue_comment:
    types: [created, edited]

# Per issue, not global. Several comments in a row are the normal case and a shared group would
# silently drop all but one of them.
concurrency:
  group: %%STAFF%%-mention-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  answer:
    # Only a human this org answers to, only on a real mention. A bot quoting the phrase must
    # never wake the loop.
    #
    # The list is every login in `org.yaml`'s `humans:` (or the singular `human:`), so a second
    # founder can wake a staff member without their comment being dropped in silence. One human
    # is a one-element list: the gate has a single shape whatever the org looks like.
    #
    # The outer gate is on `sender` — the account that performed the action — and not on the author
    # of the thing it acted on. That distinction is load-bearing on the `issues` route: the pinned
    # status issue is opened by a human and then edited by this staff member on every run, so an
    # author check would let the agent's own edit wake another run, which would edit it again.
    #
    # One spelling of the mention is enough: GitHub's `contains` is documented as not case
    # sensitive, so this already matches an uppercase mention at the start of a sentence.
    #
    # The second route is a peer's ask: a new issue opened by an App, never this staff member's
    # own, carrying a `from-<handle>` label. Only `opened`, so the peer editing its own issue
    # later wakes nobody. It names no peer, so a later hire needs no regenerated caller: the only
    # accounts that can open an issue on a private tracker are the people and Apps it is
    # installed for. A peer run may not file on another peer, and session.yaml holds peer runs
    # to the day's limit, so two staff cannot wake each other forever.
    if: >-
      (
        contains(fromJSON('%%HUMAN_LOGINS%%'), github.event.sender.login) &&
        (
          (github.event_name == 'issue_comment' &&
           contains(fromJSON('%%HUMAN_LOGINS%%'), github.event.comment.user.login) &&
           contains(github.event.comment.body, '%%MENTION%%')) ||
          (github.event_name == 'issues' &&
           contains(github.event.issue.body, '%%MENTION%%'))
        )
      ) || (
        github.event_name == 'issues' && github.event.action == 'opened' &&
        endsWith(github.event.sender.login, '[bot]') &&
        github.event.sender.login != '%%APP%%[bot]' &&
        contains(join(github.event.issue.labels.*.name, ','), 'from-')
      )
    # The ceiling on what session.yaml's job token may do: reading the checkout, and the one
    # comment that says a run failed when the App that would normally say so is what broke.
    # A called workflow cannot raise these, so they have to be granted here.
    #
    # `actions` is for the daily limit, which counts this repo's runs today. It is `write`
    # because session.yaml's job asks for that (a daily run starts its follow-on with it), and a
    # called job asking for more than its caller granted fails before it starts.
    permissions:
      contents: read
      issues: write
      actions: write
    uses: %%OPS_REPO%%/.github/workflows/session.yaml@main
    with:
      staff: %%STAFF%%
      kind: mention
      trigger: ${{ contains(fromJSON('%%HUMAN_LOGINS%%'), github.event.sender.login) && 'mention' || 'peer' }}
      max_runs_per_day: %%MAX_RUNS%%
      ops_repo: %%OPS_REPO%%
      model: %%MODEL%%
      timeout_minutes: %%MENTION_TIMEOUT%%
      allowed_tools: "%%ALLOWED_TOOLS%%"
      issue_number: ${{ github.event.issue.number }}
      comment_id: ${{ github.event.comment.id }}
    secrets:
      APP_ID: ${{ secrets.%%SECRET_PREFIX%%_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.%%SECRET_PREFIX%%_APP_PRIVATE_KEY }}
      PUBLIC_APP_ID: ${{ secrets.%%PUBLIC_SECRET_PREFIX%%_APP_ID }}
      PUBLIC_APP_PRIVATE_KEY: ${{ secrets.%%PUBLIC_SECRET_PREFIX%%_APP_PRIVATE_KEY }}
      AGENT_TOKEN: ${{ secrets.%%AGENT_SECRET%% }}
