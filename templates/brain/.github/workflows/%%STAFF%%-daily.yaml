name: %%STAFF_UPPER%% daily run

# Generated by roster. The body lives in %%OPS_REPO%%/.github/workflows/session.yaml.
# Edit this file only to change the schedule; everything else belongs in the ops repo, where
# one change reaches every staff member.
#
# NOTE: %%TOKENS%% are filled by `roster hire`; GitHub's own ${{ }} are left alone.

# The trigger and the date, as the Actions list shows it. The daily limit counts follow-on runs
# by this name.
run-name: "%%STAFF%% ${{ github.event_name == 'schedule' && 'daily' || inputs.trigger || 'manual' }}"

on:
  schedule:
    - cron: "%%SCHEDULE%%"
  # By hand, from Run once now, or as a follow-on: a daily run that ended with the next step
  # ready starts one more, up to max_runs_per_day.
  workflow_dispatch:
    inputs:
      trigger:
        description: "manual | follow-on"
        required: false
        default: manual
        type: string

# A second run while one is in flight would fight it over the tracker and the branch state. A
# follow-on is started from inside the run before it, so it waits here until that one ends.
concurrency:
  group: %%STAFF%%-session
  cancel-in-progress: false

jobs:
  session:
    # The ceiling on what session.yaml's job token may do: reading the checkout, and the one
    # comment that says a run failed when the App that would normally say so is what broke.
    # A called workflow cannot raise these, so they have to be granted here.
    #
    # `actions` is for the daily limit, which reads this repo's runs, and for starting a
    # follow-on run, which the job token may do: a workflow_dispatch it sends still starts a run.
    permissions:
      contents: read
      issues: write
      actions: write
    uses: %%OPS_REPO%%/.github/workflows/session.yaml@main
    with:
      staff: %%STAFF%%
      kind: daily
      trigger: ${{ github.event_name == 'schedule' && 'daily' || inputs.trigger || 'manual' }}
      max_runs_per_day: %%MAX_RUNS%%
      ops_repo: %%OPS_REPO%%
      model: %%MODEL%%
      timeout_minutes: %%TIMEOUT%%
      allowed_tools: "%%ALLOWED_TOOLS%%"
    secrets:
      APP_ID: ${{ secrets.%%SECRET_PREFIX%%_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.%%SECRET_PREFIX%%_APP_PRIVATE_KEY }}
      PUBLIC_APP_ID: ${{ secrets.%%PUBLIC_SECRET_PREFIX%%_APP_ID }}
      PUBLIC_APP_PRIVATE_KEY: ${{ secrets.%%PUBLIC_SECRET_PREFIX%%_APP_PRIVATE_KEY }}
      AGENT_TOKEN: ${{ secrets.%%AGENT_SECRET%% }}
