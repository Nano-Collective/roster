name: %%STAFF_UPPER%% daily run

# Generated by roster from staff.yaml. The body lives in %%OPS_REPO%%/.github/workflows/session.yaml.
# The schedule is staff.yaml's `schedule:` (the daily round) and `routines:`; change those, in
# the portal or with `roster routine`, rather than this file.
#
# NOTE: %%TOKENS%% are filled by `roster hire`; GitHub's own ${{ }} are left alone.

# The trigger, as the Actions list shows it: "cto daily", "cto routine monday-plan". The daily
# limit counts follow-on runs by this name.
run-name: "%%STAFF%% ${{ github.event_name == 'schedule' && (%%ROUTINE%% != '' && format('routine {0}', %%ROUTINE%%) || 'daily') || inputs.routine != '' && format('routine {0}', inputs.routine) || inputs.trigger || 'manual' }}"

on:
  # The daily round first, then one line per routine. The cron that fired says which it was.
  schedule:
%%SCHEDULES%%
  # By hand, from Run once now, or as a follow-on: a daily run that ended with the next step
  # ready starts one more, up to max_runs_per_day. `routine` runs one routine now.
  workflow_dispatch:
    inputs:
      trigger:
        description: "manual | follow-on"
        required: false
        default: manual
        type: string
      routine:
        description: "a routine's id, to run that routine now"
        required: false
        default: ""
        type: string

# A second run while one is in flight would fight it over the tracker and the branch state. A
# follow-on is started from inside the run before it, so it waits here until that one ends.
concurrency:
  group: %%STAFF%%-session
  cancel-in-progress: false

jobs:
  session:
    # The ceiling on what session.yaml's job token may do: reading the checkout, and the one
    # comment that says a run failed when the App that would normally say so is what broke.
    # A called workflow cannot raise these, so they have to be granted here.
    #
    # `actions` is for the daily limit, which reads this repo's runs, and for starting a
    # follow-on run, which the job token may do: a workflow_dispatch it sends still starts a run.
    permissions:
      contents: read
      issues: write
      actions: write
      id-token: write
    uses: %%OPS_REPO%%/.github/workflows/session.yaml@main
    with:
      staff: %%STAFF%%
      kind: daily
      trigger: ${{ github.event_name == 'schedule' && (%%ROUTINE%% != '' && 'routine' || 'daily') || inputs.routine != '' && 'routine' || inputs.trigger || 'manual' }}
      routine: ${{ github.event_name == 'schedule' && %%ROUTINE%% || inputs.routine || '' }}
      max_runs_per_day: %%MAX_RUNS%%
      ops_repo: %%OPS_REPO%%
      model: %%MODEL%%
      timeout_minutes: %%TIMEOUT%%
      allowed_tools: "%%ALLOWED_TOOLS%%"
      secret_prefix: %%SECRET_PREFIX%%
      public_secret_prefix: %%PUBLIC_SECRET_PREFIX%%
      agent_secret: %%AGENT_SECRET%%
    # Inherited rather than listed, so a connector's key added later reaches the run without
    # this file changing. session.yaml reads the App's pair and the agent credential by the
    # names above, and each connector's key by the name its connector gives it.
    secrets: inherit
