<!doctype html>
<html lang="en" data-astryx-theme="neutral">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>roster</title>
<!-- Inline, so a local page with no network still has a tab icon and the console stays clean.
     The mark in the theme's accent, light or dark as the system is, like the one in the sidebar. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Cstyle%3Erect%7Bfill:%231b1b1b%7Dpath%7Bstroke:%23fff%7D%40media%20%28prefers-color-scheme:dark%29%7Brect%7Bfill:%23f1f1f1%7Dpath%7Bstroke:%23111%7D%7D%3C/style%3E%3Crect%20width='32'%20height='32'%20rx='8'/%3E%3Cpath%20d='M11%2023V10h6a4%204%200%200%201%200%208h-6m6%200%204.5%205'%20fill='none'%20stroke-width='2.6'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3C/svg%3E">
<!-- Stylesheets and modules are served from /assets by `roster portal`. No build step:
     editing one of these files and reloading is the whole edit loop. -->
<!-- Astryx's neutral theme and its components, under the portal's own class names. First, so
     it is the floor every stylesheet below builds on. Generated by scripts/astryx.mjs. -->
<link rel="stylesheet" href="/assets/css/astryx.css">
<!-- Figtree is the theme's face. Offline, the system font it names next stands in. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/layout.css">
<link rel="stylesheet" href="/assets/css/markdown.css">
<link rel="stylesheet" href="/assets/css/brain.css">
<link rel="stylesheet" href="/assets/css/inbox.css">
<link rel="stylesheet" href="/assets/css/home.css">
<link rel="stylesheet" href="/assets/css/search.css">
<link rel="stylesheet" href="/assets/css/graph.css">
<link rel="stylesheet" href="/assets/css/diff.css">
<link rel="stylesheet" href="/assets/css/health.css">
<link rel="stylesheet" href="/assets/css/runs.css">
<link rel="stylesheet" href="/assets/css/setup.css">
<link rel="stylesheet" href="/assets/css/connectors.css">
<link rel="stylesheet" href="/assets/css/routines.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="mark"></span>roster<small id="orgname">loading…</small></div>
    <button class="refreshall" id="refreshall" title="Reload everything from GitHub (r)">
      <span class="sync" data-icon="refresh"></span><span id="loaded">data now</span>
    </button>

    <button class="sidesearch" id="sidesearch" title="Search everything (⌘K)">
      <span class="ic" data-icon="search"></span><span class="t">Search</span><kbd id="searchkey">⌘K</kbd>
    </button>

    <!-- Only while something is left to set up; app.js decides. -->
    <button class="nav top" id="setupnav" data-view="setup" hidden>
      <span class="ic" data-icon="task-done"></span> Getting started
      <span class="n" id="setupcount"></span>
    </button>
    <button class="nav top" id="homenav" data-view="home" title="What needs you, and who is working">
      <span class="ic" data-icon="inbox"></span> Home
      <span class="n" id="homecount"></span>
    </button>
    <button class="nav" id="inboxnav" data-view="inbox" title="Every open issue on each staff member's tracker">
      <span class="ic" data-icon="issue-open"></span> Trackers
      <span class="n" id="inboxcount"></span>
    </button>
    <div class="staffviews" id="inboxsub" hidden></div>
    <button class="nav" id="runsnav" data-view="runs" title="What ran, how it ended, and what it cost">
      <span class="ic" data-icon="play"></span> Runs
    </button>
    <button class="nav" id="orgnav" data-view="org">
      <span class="ic" data-icon="file"></span> Org
    </button>
    <button class="nav" id="staffnav" data-view="staff">
      <span class="ic" data-icon="person"></span> Staff
    </button>
    <button class="nav" id="routinesnav" data-view="routines" title="When the staff wake up, and what they do then">
      <span class="ic" data-icon="clock"></span> Routines
    </button>
    <button class="nav" id="connectorsnav" data-view="connectors" title="Outside services the staff can use">
      <span class="ic" data-icon="plug"></span> Connectors
    </button>
    <button class="nav" id="docsnav" data-view="docs">
      <span class="ic" data-icon="docs"></span> Docs
    </button>

    <!-- The heading is the fold. Collapsed, it carries the count, because a hidden list still
         has to say how much it is hiding. -->
    <!-- Named apart from the Staff screen above it: two controls both called "Staff" is how a
         click meant for the screen landed on the fold, for people and for automation alike. -->
    <button class="sect sectfold" id="stafffold" aria-expanded="false" aria-controls="stafflist"
            aria-label="Staff list" title="Show or hide each staff member's own screens">
      <span class="caret" data-icon="chevron"></span>Staff<span class="n" id="staffcount" hidden></span>
    </button>
    <div id="stafflist"></div>

    <div class="sidefoot">
      <button class="nav" id="theme">Theme</button>
    </div>
  </aside>
  <main id="main"><p class="sub">Loading…</p></main>
</div>

<script type="module" src="/assets/js/app.js"></script>
</body>
</html>
