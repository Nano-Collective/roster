<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>roster</title>
<style>
:root{
  --bg:#0e1013; --panel:#15181d; --panel-2:#1b1f26; --line:#252a33;
  --ink:#e6e9ef; --ink-dim:#9aa3b2; --ink-faint:#6b7484;
  --accent:#7cc7a4; --accent-dim:#3d6b56;
  --warn:#d8a657; --err:#e07b7b;
  --will:#7aa2f7; --measured:#7cc7a4; --derived:#c99bd6;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
}
/* System preference wins unless the toggle has stamped data-theme on the root. */
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#fbfbfa; --panel:#fff; --panel-2:#f4f5f7; --line:#e3e5ea;
    --ink:#1b1f26; --ink-dim:#5b6472; --ink-faint:#8b95a5;
    --accent:#2f7d5b; --accent-dim:#a8d5bf;
    --warn:#a5701d; --err:#b34a4a;
    --will:#3b5fa8; --measured:#2f7d5b; --derived:#8a52a8;
  }
}
:root[data-theme="light"]{
    --bg:#fbfbfa; --panel:#fff; --panel-2:#f4f5f7; --line:#e3e5ea;
    --ink:#1b1f26; --ink-dim:#5b6472; --ink-faint:#8b95a5;
    --accent:#2f7d5b; --accent-dim:#a8d5bf;
    --warn:#a5701d; --err:#b34a4a;
    --will:#3b5fa8; --measured:#2f7d5b; --derived:#8a52a8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);
     -webkit-font-smoothing:antialiased}
a{color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
@media (max-width:820px){.app{grid-template-columns:1fr}.side{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}}

/* ---------- sidebar ---------- */
.side{background:var(--panel);border-right:1px solid var(--line);padding:20px 0;
      position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 20px 18px;font:600 15px var(--sans);letter-spacing:-.01em}
.brand small{display:block;color:var(--ink-faint);font-weight:400;font-size:11.5px;
             letter-spacing:.02em;margin-top:2px}
.sect{padding:14px 20px 6px;font:600 10.5px var(--sans);letter-spacing:.09em;
      text-transform:uppercase;color:var(--ink-faint)}
.nav{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink-dim);
     font:14px var(--sans);padding:7px 20px;cursor:pointer;border-left:2px solid transparent}
.nav:hover{color:var(--ink);background:var(--panel-2)}
.nav[aria-current="true"]{color:var(--ink);border-left-color:var(--accent);background:var(--panel-2)}
.nav .n{float:right;color:var(--ink-faint);font:11px var(--mono)}

/* ---------- main ---------- */
main{padding:28px 34px 80px;max-width:1180px;overflow-x:hidden}
h1{font:600 21px var(--sans);margin:0 0 4px;letter-spacing:-.015em}
.sub{color:var(--ink-dim);margin:0 0 24px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:15px 17px;margin-bottom:11px}
.card h3{margin:0 0 3px;font:600 14px var(--sans)}
.meta{color:var(--ink-faint);font:11.5px var(--mono)}

.grid{display:grid;gap:11px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px 16px}
.stat b{display:block;font:600 25px var(--sans);letter-spacing:-.02em}
.stat span{color:var(--ink-faint);font-size:12px}

/* ---------- memory ---------- */
.fact{border-bottom:1px solid var(--line);padding:11px 2px}
.fact:last-child{border-bottom:0}
.slug{font:12px var(--mono);color:var(--accent);cursor:pointer}
.slug:hover{text-decoration:underline}
.stmt{margin:3px 0 0}
.so{margin:4px 0 0;color:var(--ink-dim);font-size:13.2px}
.so b{color:var(--ink);font-weight:600}
.tag{display:inline-block;font:10.5px var(--mono);padding:1px 6px;border-radius:20px;
     border:1px solid var(--line);color:var(--ink-faint);margin-left:6px;vertical-align:1px}
.tag.will{color:var(--will);border-color:var(--will)}
.tag.measured{color:var(--measured);border-color:var(--measured)}
.tag.derived{color:var(--derived);border-color:var(--derived)}
.notelink{font:11.5px var(--mono);color:var(--ink-faint);cursor:pointer;margin-left:6px}
.notelink:hover{color:var(--accent)}

input[type=search],select{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
  border-radius:7px;padding:7px 11px;font:13px var(--sans);outline:none}
input[type=search]{width:280px}
input[type=search]:focus,select:focus{border-color:var(--accent-dim)}

/* ---------- tree + viewer ---------- */
.split{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.tree{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px;
      max-height:74vh;overflow:auto}
.tdir{font:600 11px var(--mono);color:var(--ink-faint);padding:8px 8px 4px;letter-spacing:.04em}
.tfile{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink-dim);
       font:12.5px var(--mono);padding:4px 8px;border-radius:5px;cursor:pointer;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tfile:hover{background:var(--panel-2);color:var(--ink)}
.tfile[aria-current="true"]{background:var(--panel-2);color:var(--accent)}
.tfile i{float:right;color:var(--ink-faint);font-style:normal;font-size:10.5px}
.viewer{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:20px 22px;
        min-height:340px;max-height:74vh;overflow:auto}
.viewer pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12.5px/1.65 var(--mono);color:var(--ink-dim)}
.viewer img{max-width:100%;border-radius:6px;background:#fff}
.viewer table{border-collapse:collapse;font:12px var(--mono);width:100%}
.viewer td,.viewer th{border:1px solid var(--line);padding:4px 8px;text-align:left;white-space:nowrap}
.viewer th{position:sticky;top:0;background:var(--panel-2);color:var(--ink)}
.gallery{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.gallery figure{margin:0}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:contain;background:var(--panel-2);border-radius:6px;
             border:1px solid var(--line);cursor:pointer}
.gallery figcaption{font:10.5px var(--mono);color:var(--ink-faint);margin-top:4px;
                    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- graph ---------- */
.graphwrap{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}
#graph{display:block;width:100%;height:72vh;cursor:grab;touch-action:none}
#graph.grabbing{cursor:grabbing}
#graph.onnode{cursor:pointer}
.legend{position:absolute;left:12px;bottom:12px;font:11px var(--mono);color:var(--ink-dim);
        background:color-mix(in srgb,var(--panel) 92%,transparent);padding:8px 11px;border-radius:7px;
        border:1px solid var(--line);max-height:44%;overflow:auto}
.legend div{white-space:nowrap;line-height:1.75;cursor:pointer;opacity:.55}
.legend div.on{opacity:1}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.gtools{position:absolute;right:12px;top:12px;display:flex;gap:7px;align-items:center}
.gtools button{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);
        color:var(--ink-dim);border-radius:7px;padding:5px 10px;font:11.5px var(--mono);cursor:pointer}
.gtools button:hover{color:var(--ink);border-color:var(--accent-dim)}
.gtools input[type=search]{width:170px;padding:5px 10px;font:11.5px var(--mono)}
.sheet{position:absolute;right:0;top:0;bottom:0;width:370px;max-width:100%;
       background:var(--panel);border-left:1px solid var(--line);padding:20px 22px;
       overflow:auto;box-shadow:-14px 0 34px rgba(0,0,0,.16)}
.sheet .x{position:absolute;right:14px;top:14px;background:none;border:0;color:var(--ink-faint);
       cursor:pointer;font:14px var(--mono)}
.sheet .skind{font:10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.sheet h4{margin:0 0 10px;font:600 15px var(--mono);word-break:break-word;padding-right:22px;letter-spacing:-.01em}
.sheet p{margin:8px 0 0;font-size:13.5px;line-height:1.6}
.sheet .lk{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink-dim);
       font:12px var(--mono);padding:4px 0;cursor:pointer;white-space:nowrap;overflow:hidden;
       text-overflow:ellipsis}
.sheet .lk:hover{color:var(--accent)}
@media (max-width:760px){.sheet{width:100%}}
.ghbtn{display:inline-block;padding:5px 11px;border:1px solid var(--line);border-radius:7px;
       font:12px var(--sans);color:var(--ink-dim);text-decoration:none;white-space:nowrap}
.ghbtn:hover{color:var(--ink);border-color:var(--accent-dim);background:var(--panel-2)}
.iconbtn{background:var(--panel-2);border:1px solid var(--line);color:var(--ink-dim);
       border-radius:7px;width:34px;height:34px;cursor:pointer;font-size:15px;line-height:1}
.iconbtn:hover{color:var(--ink);border-color:var(--accent-dim)}
.iconbtn .sync{display:inline-block}
.iconbtn.spin .sync{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- inbox rows ---------- */
.irow{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;
      padding:9px 10px;border-radius:7px;color:var(--ink-dim)}
.irow:hover{background:var(--panel-2)}
.irow:focus{outline:none}
.irow:focus-visible{outline:2px solid var(--accent-dim);outline-offset:-2px}
.tfile:focus{outline:none}
.tfile:focus-visible{outline:2px solid var(--accent-dim);outline-offset:-2px}
.irow[aria-current="true"]{background:var(--panel-2);box-shadow:inset 2px 0 0 var(--accent)}
.ititle{font:13.5px/1.4 var(--sans);color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;
        -webkit-box-orient:vertical;overflow:hidden}
.irow[aria-current="true"] .ititle{color:var(--accent)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);
     margin-right:6px;vertical-align:2px}
.imeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:5px}
.imeta .repo{font:10px var(--sans);letter-spacing:.03em;text-transform:uppercase;
      color:var(--ink-faint);border-right:1px solid var(--line);padding-right:7px}
.imeta .num{font:10.5px var(--mono);color:var(--ink-faint)}
.imeta .when{font:10.5px var(--sans);color:var(--ink-faint);margin-left:auto}
.ck{font:10.5px var(--mono)}
.ck.passing{color:var(--accent)} .ck.failing{color:var(--err)} .ck.pending{color:var(--warn)}
.chip{font:10px var(--sans);letter-spacing:.02em;padding:1.5px 7px;border-radius:20px;
      border:1px solid var(--line);color:var(--ink-faint);white-space:nowrap}
.chip.hot{color:var(--err);border-color:color-mix(in srgb,var(--err) 45%,transparent)}
.chip.warm{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.chip.cool{color:var(--will);border-color:color-mix(in srgb,var(--will) 40%,transparent)}

/* ---------- thread ---------- */
.thead{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:4px}
.trow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.thead h3{margin:8px 0 0;font:600 17px/1.35 var(--sans);letter-spacing:-.012em;color:var(--ink)}
.cmt{border-top:1px solid var(--line);padding:16px 0}
.cmt.first{border-top:0}
.cbody{margin-top:8px;font-size:13.5px;line-height:1.65;max-width:74ch}
.cbody p{margin:0 0 10px}
.cbody .ch{font-weight:600;color:var(--ink);margin:16px 0 6px}
.cbody .ch.h1{font-size:16px} .cbody .ch.h2{font-size:15px} .cbody .ch.h3{font-size:14px}
.cbody .cli{margin:3px 0}
.cbody .cli .box{color:var(--ink-faint)}
.cbody code{font:12px var(--mono);color:var(--accent);background:var(--panel-2);
      padding:1px 4px;border-radius:4px}
.cbody .cblock{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;
      padding:10px 12px;font:12px/1.6 var(--mono);white-space:pre-wrap;margin:10px 0;color:var(--ink-dim)}
.cbody .cblock code{background:none;padding:0}
.cbody a{color:var(--will)}
.cbody blockquote{margin:10px 0;padding:2px 0 2px 12px;border-left:2px solid var(--line);color:var(--ink-dim)}
.cbody hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.ctable{overflow-x:auto;margin:10px 0;max-width:100%}
.ctable table{border-collapse:collapse;font-size:12.5px;width:100%}
.ctable th,.ctable td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.ctable th{background:var(--panel-2);color:var(--ink);font-weight:600;white-space:nowrap}
.ctable td{color:var(--ink-dim)}
.ctable td b{color:var(--ink)}
.pill{font:11px var(--mono);color:var(--ink-faint);border:1px solid var(--line);
      border-radius:20px;padding:2px 9px}
.err{color:var(--err)} .warn{color:var(--warn)} .ok{color:var(--accent)}
.empty{color:var(--ink-faint);padding:26px 0;text-align:center;font-size:13px}
kbd{font:11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
    padding:1px 5px;color:var(--ink-dim)}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">roster<small id="orgname">loading…</small></div>
    <div class="sect">Org</div>
    <button class="nav" id="inboxnav" data-view="inbox">Inbox</button>
    <div class="sect">Staff</div>
    <div id="stafflist"></div>
    <div class="sect">View</div>
    <div id="viewlist"></div>
    <div class="sect">Appearance</div>
    <button class="nav" id="theme">Theme</button>
  </aside>
  <main id="main"><p class="sub">Loading…</p></main>
</div>

<script>
const VIEWS = [
  ["memory", "Memory"],
  ["graph", "Graph"],
  ["brain", "Brain"],
  ["changed", "What changed"],
  ["health", "Health"],
];

// `var` rather than `let` on purpose: these are the page's state, and a classic script's
// top-level `let` is not reachable as a global, which makes the state untestable.
var DATA = null;
var staffHandle = null;
var view = "memory";
var query = "";
var openFile = null;
var fileQuery = "";
var changedQuery = "";
var changedFilter = "";

/* The URL is the state, so a refresh lands where you were and a link is shareable.
   Changing staff or view pushes; typing in a filter replaces, so a search does not
   bury the back button under one entry per keystroke. */
var applyingHash = false;

function readHash() {
  const raw = (location.hash || "").replace(/^#\/?/, "");
  if (!raw) return null;
  const [path, qs] = raw.split("?");
  const [handle, v] = path.split("/");
  const params = new URLSearchParams(qs || "");
  return { handle, view: v, q: params.get("q") || "", f: params.get("f") || null };
}

function writeHash(push) {
  if (applyingHash || !staffHandle) return;
  const params = new URLSearchParams();
  const q = view === "brain" ? fileQuery : view === "changed" ? changedQuery : query;
  if (q) params.set("q", q);
  if (view === "brain" && openFile) params.set("f", openFile);
  if (view === "inbox") {
    if (inboxFilter) params.set("s", inboxFilter);
    if (inboxOpen) params.set("t", inboxOpen.repo + "#" + inboxOpen.number + ":" + inboxOpen.kind);
  }
  const qs = params.toString();
  const next = "#/" + staffHandle + "/" + view + (qs ? "?" + qs : "");
  if (location.hash === next) return;
  if (history.pushState) history[push ? "pushState" : "replaceState"](null, "", next);
  else location.hash = next;
}

function applyHash() {
  const h = readHash();
  if (!h) return false;
  const known = DATA.staff.some((s) => s.handle === h.handle);
  if (known) staffHandle = h.handle;
  if (h.view === "inbox" || VIEWS.some(([id]) => id === h.view)) view = h.view;
  if (view === "brain") { fileQuery = h.q; openFile = h.f; }
  else if (view === "changed") changedQuery = h.q;
  else query = h.q;
  if (view === "inbox") {
    inboxFilter = new URLSearchParams((location.hash.split("?")[1]) || "").get("s") || "";
    const th = new URLSearchParams((location.hash.split("?")[1]) || "").get("t");
    if (th) {
      const [repoNum, kind] = th.split(":");
      const [repo, number] = repoNum.split("#");
      inboxOpen = { repo, number: Number(number), kind: kind === "pr" ? "pr" : "issue" };
    }
  }
  return known;
}

const $ = (s, r = document) => r.querySelector(s);
const el = (t, props = {}, kids = []) => {
  const n = Object.assign(document.createElement(t), props);
  for (const k of [].concat(kids)) n.append(k);
  return n;
};
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const staff = () => DATA.staff.find((s) => s.handle === staffHandle) ?? DATA.staff[0];

/* Renders the small subset of markdown that appears in a fact line. Deliberately not a
   markdown parser: escaping first, then a handful of inline forms. */
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code style="font:12px var(--mono);color:var(--accent)">$1</code>')
    .replace(/\[\[([a-z0-9-]+)\]\]/g, '<span class="slug" data-goto="$1">[[$1]]</span>')
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

async function boot() {
  const res = await fetch("/api/org");
  DATA = await res.json();
  staffHandle = DATA.staff[0]?.handle ?? null;
  $("#orgname").textContent = DATA.name + " · " + DATA.staff.length + " staff";

  $("#stafflist").replaceChildren(...DATA.staff.map((s) => {
    const b = el("button", { className: "nav", onclick: () => { staffHandle = s.handle; openFile = null; render(); } });
    b.dataset.staff = s.handle;
    b.title = s.name + " · " + s.dir;
    b.append(s.handle.toUpperCase());
    b.append(el("span", { className: "n", textContent: s.facts.length }));
    return b;
  }));
  $("#viewlist").replaceChildren(...VIEWS.map(([id, label]) => {
    const b = el("button", { className: "nav", textContent: label, onclick: () => { view = id; render(); } });
    b.dataset.view = id;
    return b;
  }));
  $("#inboxnav").onclick = () => { view = "inbox"; render(); };
  applyHash();
  addEventListener("hashchange", () => {
    applyingHash = true;
    $("#inboxnav").onclick = () => { view = "inbox"; render(); };
  applyHash();
    applyingHash = false;
    render();
  });
  render();
}

function render() {
  for (const b of document.querySelectorAll(".nav")) {
    if (b.dataset.staff) b.setAttribute("aria-current", String(b.dataset.staff === staffHandle));
    if (b.dataset.view) b.setAttribute("aria-current", String(b.dataset.view === view));
  }
  writeHash(true);
  const m = $("#main");
  m.replaceChildren();
  ({ inbox: viewInbox, memory: viewMemory, graph: viewGraph, brain: viewBrain, changed: viewChanged, health: viewHealth }[view] ?? viewMemory)(m);
}

/* -------------------------------- inbox ------------------------------- */
var INBOX = null;
var inboxFilter = "";
var inboxOpen = null;

function viewInbox(m) {
  m.append(el("h1", { textContent: "Inbox" }));
  const sub = el("p", { className: "sub", textContent: "Everything open across the org." });
  m.append(sub);

  const search = el("input", { type: "search", placeholder: "Filter by title, label, repo…", value: query });
  const scope = el("select");
  scope.append(
    el("option", { value: "", textContent: "Everything" }),
    el("option", { value: "mine", textContent: "On " + (DATA.human.name ?? "me") }),
    el("option", { value: "decision", textContent: "Decisions" }),
    el("option", { value: "pr", textContent: "Open work (PRs)" }),
  );
  scope.value = inboxFilter;
  const refresh = el("button", { className: "iconbtn", title: "Refresh from GitHub" });
  refresh.innerHTML = '<span class="sync">\u27F3</span>';
  m.append(el("div", { className: "row", style: "margin-bottom:16px" }, [search, scope, refresh]));

  const split = el("div", { className: "split" });
  const list = el("div", { className: "tree" });
  const viewer = el("div", { className: "viewer" });
  split.append(list, viewer);
  m.append(split);

  search.oninput = () => { query = search.value; writeHash(false); paint(); };
  scope.onchange = () => { inboxFilter = scope.value; writeHash(false); paint(); };
  refresh.onclick = () => { refresh.classList.add("spin"); load(true); };

  if (INBOX) { paint(); if (inboxOpen) openThread(inboxOpen); }
  else load(false);

  async function load(force) {
    list.replaceChildren(el("p", { className: "empty", textContent: "Asking GitHub…" }));
    try {
      INBOX = await (await fetch("/api/inbox" + (force ? "?refresh=1" : ""))).json();
    } catch (e) {
      refresh.classList.remove("spin");
      list.replaceChildren(el("p", { className: "empty err", textContent: "Could not reach GitHub: " + e.message }));
      return;
    }
    refresh.classList.remove("spin");
    paint();
  }

  function paint() {
    if (!INBOX) return;
    const q = query.trim().toLowerCase();
    const human = DATA.human.github;

    let items = INBOX.items.filter((i) =>
      (!q || (i.title + " " + i.repo + " " + i.labels.join(" ") + " #" + i.number).toLowerCase().includes(q)));
    if (inboxFilter === "mine") items = items.filter((i) => i.assignees.includes(human));
    else if (inboxFilter === "decision") items = items.filter((i) => i.labels.includes("decision"));
    else if (inboxFilter === "pr") items = items.filter((i) => i.kind === "pr");

    const onYou = INBOX.items.filter((i) => i.assignees.includes(human)).length;
    const prs = INBOX.items.filter((i) => i.kind === "pr").length;
    sub.innerHTML = INBOX.items.length + " open across " + (INBOX.repos ?? []).length + " repos · " +
      "<b>" + onYou + " on " + esc(DATA.human.name ?? "you") + "</b> · " + prs + " open PRs" +
      (INBOX.fetchedAt ? ' <span class="meta">· checked ' + ago(INBOX.fetchedAt) + "</span>" : "");

    list.replaceChildren();
    for (const e of INBOX.errors ?? []) {
      list.append(el("div", { className: "tdir err", textContent: e }));
    }

    // Newest first, flat. Grouping by repo buried a fresh comment under whichever project
    // happened to sort first; the project moves onto the row instead.
    items = items.slice().sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
    if (!items.length) { list.append(el("p", { className: "empty", textContent: "Nothing matches." })); return; }

    {
      for (const i of items) {
        const b = el("button", { className: "irow" });
        const mine = i.assignees.includes(human);
        const chips = i.labels.slice(0, 3)
          .map((l) => '<span class="chip ' + (LABEL_TONE[l] ?? "") + '">' + esc(l) + "</span>").join("");
        b.innerHTML =
          '<div class="ititle">' + (mine ? '<span class="dot" title="assigned to you"></span>' : "") +
            esc(i.title) + "</div>" +
          '<div class="imeta">' +
            '<span class="repo">' + esc(i.repo.split("/")[1]) + "</span>" +
            '<span class="num">' + (i.kind === "pr" ? "PR " : "") + "#" + i.number + "</span>" +
            (i.checks && i.checks !== "none" ? '<span class="ck ' + i.checks + '">' + checkGlyph(i.checks) + "</span>" : "") +
            chips +
            '<span class="when">' + ago(i.updatedAt) + "</span>" +
          "</div>";
        b.onclick = () => {
          markCurrent(list, b);
          inboxOpen = { repo: i.repo, number: i.number, kind: i.kind };
          writeHash(false);
          openThread(inboxOpen);
        };
        list.append(b);
      }
    }
  }

  async function openThread(ref) {
    viewer.replaceChildren(el("p", { className: "empty", textContent: "Loading…" }));
    const item = (INBOX?.items ?? []).find((i) => i.repo === ref.repo && i.number === ref.number);
    let t;
    try {
      const res = await fetch("/api/thread?repo=" + encodeURIComponent(ref.repo) +
        "&number=" + ref.number + "&kind=" + ref.kind);
      t = await res.json();
      if (t.error) throw new Error(t.error);
    } catch (e) {
      viewer.replaceChildren(el("p", { className: "empty err", textContent: "Could not load: " + e.message }));
      return;
    }

    const head = el("div", { className: "thead" });
    head.innerHTML =
      '<div class="trow">' +
        '<div class="meta">' + esc(ref.repo) + " · " + (ref.kind === "pr" ? "PR " : "") + "#" + ref.number +
          ' · <span class="' + (t.state === "OPEN" ? "ok" : "") + '">' + esc(t.state ?? "") + "</span></div>" +
        '<a class="ghbtn" href="' + esc(t.url) + '" target="_blank" rel="noopener">Open in GitHub</a>' +
      "</div>" +
      "<h3>" + esc(t.title) + "</h3>" +
      (item && item.labels.length
        ? '<div class="row" style="margin-top:8px">' +
          item.labels.map((l) => '<span class="chip ' + (LABEL_TONE[l] ?? "") + '">' + esc(l) + "</span>").join("") +
          "</div>"
        : "");
    viewer.replaceChildren(head);

    viewer.append(comment(t.author, t.createdAt, t.body, true));
    for (const c of t.comments) viewer.append(comment(c.author, c.createdAt, c.body, false));
    if (!t.comments.length) {
      viewer.append(el("p", { className: "meta", style: "margin-top:14px", textContent: "No replies yet." }));
    }
  }
}

const LABEL_TONE = { decision: "hot", blocked: "hot", will: "hot", review: "warm", submit: "warm",
                     idea: "cool", build: "cool", setup: "cool", data: "cool" };

function ago(iso) {
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 90) return "just now";
  if (s < 5400) return Math.round(s / 60) + "m ago";
  if (s < 172800) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
}

function checkGlyph(state) {
  return state === "passing" ? "✓" : state === "failing" ? "✕" : "•";
}

function comment(author, when, body, isBody) {
  const d = el("div", { className: "cmt" + (isBody ? " first" : "") });
  d.append(el("div", { className: "meta", textContent: (author || "?") + " · " + new Date(when).toLocaleString() }));
  d.append(el("div", { className: "cbody", innerHTML: mdlite(body || "_no description_") }));
  return d;
}

/* Enough markdown for an issue thread, escaped first. Not a general parser: tables,
   headings, lists, code, quotes, rules and links, which is what these threads contain.
   Tables matter most - the status issues are mostly tables, and without them the body is
   a wall of pipes. */
function mdlite(src) {
  const lines = esc(src).replace(/\r/g, "").split("\n");
  const out = [];
  let i = 0;

  const inlineFmt = (s) => s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>")
    .replace(/~~([^~]+)~~/g, "<s>$1</s>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');

  const cells = (row) => {
    let s = row.trim();
    if (s.startsWith("|")) s = s.slice(1);
    if (s.endsWith("|")) s = s.slice(0, -1);
    return s.split("|").map((c) => inlineFmt(c.trim()));
  };

  while (i < lines.length) {
    const line = lines[i];

    if (line.trim().startsWith("```")) {
      const buf = [];
      i++;
      while (i < lines.length && !lines[i].trim().startsWith("```")) buf.push(lines[i++]);
      i++;
      out.push('<pre class="cblock">' + buf.join("\n") + "</pre>");
      continue;
    }

    // A table is a pipe row followed by a --- separator row.
    if (line.trim().startsWith("|") && (lines[i + 1] ?? "").replace(/[^|:\-\s]/g, "") === (lines[i + 1] ?? "").trim() &&
        /^\|?[\s:|-]+\|[\s:|-]*$/.test((lines[i + 1] ?? "").trim())) {
      const head = cells(line);
      i += 2;
      const body = [];
      while (i < lines.length && lines[i].trim().startsWith("|")) body.push(cells(lines[i++]));
      const th = head.map((h) => "<th>" + h + "</th>").join("");
      const tr = body.map((r) => "<tr>" + r.map((c) => "<td>" + c + "</td>").join("") + "</tr>").join("");
      // A leading empty header cell is how these issues start a two-column "thing | ask"
      // table; keeping the row would just print a blank strip.
      const showHead = head.some((h) => h.trim());
      out.push('<div class="ctable"><table>' + (showHead ? "<thead><tr>" + th + "</tr></thead>" : "") +
               "<tbody>" + tr + "</tbody></table></div>");
      continue;
    }

    if (!line.trim()) { i++; continue; }

    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { out.push("<div class='ch h" + h[1].length + "'>" + inlineFmt(h[2]) + "</div>"); i++; continue; }

    if (/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(line)) { out.push("<hr>"); i++; continue; }

    if (line.trim().startsWith("&gt;")) {
      const buf = [];
      while (i < lines.length && lines[i].trim().startsWith("&gt;")) {
        buf.push(inlineFmt(lines[i++].trim().replace(/^&gt;\s?/, "")));
      }
      out.push('<blockquote>' + buf.join("<br>") + "</blockquote>");
      continue;
    }

    const task = line.match(/^\s*[-*]\s+\[( |x|X)\]\s+(.*)$/);
    if (task) {
      out.push("<div class='cli'><span class='box'>" + (task[1] === " " ? "☐" : "☑") + "</span> " +
               inlineFmt(task[2]) + "</div>");
      i++; continue;
    }
    const li = line.match(/^(\s*)[-*]\s+(.*)$/);
    if (li) {
      const depth = Math.min(3, Math.floor(li[1].length / 2));
      out.push("<div class='cli' style='margin-left:" + depth * 14 + "px'>• " + inlineFmt(li[2]) + "</div>");
      i++; continue;
    }
    const ol = line.match(/^(\s*)(\d+)\.\s+(.*)$/);
    if (ol) {
      const depth = Math.min(3, Math.floor(ol[1].length / 2));
      out.push("<div class='cli' style='margin-left:" + depth * 14 + "px'>" + ol[2] + ". " + inlineFmt(ol[3]) + "</div>");
      i++; continue;
    }

    // Consecutive plain lines are one paragraph; markdown hard-wraps and we should not.
    const para = [];
    while (i < lines.length && lines[i].trim() &&
           !/^\s*([-*]|\d+\.|#{1,6}\s|\||&gt;|```)/.test(lines[i])) {
      para.push(inlineFmt(lines[i++]));
    }
    if (para.length) out.push("<p>" + para.join(" ") + "</p>");
    else { out.push("<p>" + inlineFmt(lines[i++]) + "</p>"); }
  }
  return out.join("\n");
}

/* ------------------------------- memory ------------------------------- */
function viewMemory(m) {
  const s = staff();
  m.append(el("h1", { textContent: s.name + " · memory" }));
  m.append(el("p", { className: "sub", textContent:
    s.facts.length + " facts across " + s.sections.length + " sections, " + s.notes.length + " notes. Read in full at every boot." }));

  const search = el("input", { type: "search", placeholder: "Search facts…", value: query });
  search.oninput = (e) => { query = e.target.value; writeHash(false); renderList(); };
  const sel = el("select");
  sel.append(el("option", { value: "", textContent: "All sections" }),
    ...s.sections.map((x) => el("option", { value: x, textContent: x })));
  sel.onchange = () => renderList();
  m.append(el("div", { className: "row", style: "margin-bottom:16px" }, [search, sel]));

  const host = el("div");
  m.append(host);

  function renderList() {
    const q = query.toLowerCase();
    const wanted = s.facts.filter((f) =>
      (!sel.value || f.section === sel.value) &&
      (!q || (f.slug + " " + f.statement + " " + f.consequence).toLowerCase().includes(q)));
    host.replaceChildren();
    if (!wanted.length) { host.append(el("p", { className: "empty", textContent: "Nothing matches." })); return; }

    let section = null;
    for (const f of wanted) {
      if (f.section !== section) {
        section = f.section;
        host.append(el("div", { className: "sect", style: "padding-left:0", textContent: section }));
      }
      const d = el("div", { className: "fact" });
      d.id = "fact-" + f.slug;
      d.innerHTML =
        '<span class="slug" data-goto="' + esc(f.slug) + '">' + esc(f.slug) + "</span>" +
        (f.provenance ? '<span class="tag ' + esc(f.provenance) + '">' + esc(f.provenance) + "</span>" : "") +
        (f.note ? '<span class="notelink" data-note="' + esc(f.note) + '">' + esc(f.note) + "</span>" : "") +
        '<p class="stmt">' + inline(f.statement) + "</p>" +
        (f.consequence ? '<p class="so"><b>So:</b> ' + inline(f.consequence) + "</p>"
                       : '<p class="so err">No <b>So:</b> — lint will flag this.</p>');
      host.append(d);
    }
  }
  renderList();

  host.addEventListener("click", (e) => {
    const note = e.target.closest("[data-note]");
    if (note) { openFile = "memory/" + note.dataset.note; view = "brain"; render(); return; }
    const goto = e.target.closest("[data-goto]");
    if (goto) { query = goto.dataset.goto; search.value = query; renderList(); }
  });
}

/* -------------------------------- graph ------------------------------- */
function viewGraph(m) {
  const s = staff();
  m.append(el("h1", { textContent: s.handle.toUpperCase() + " · graph" }));
  m.append(el("p", { className: "sub", innerHTML:
    "One node per group, sized by what it holds. <b>Click a group to fan its facts outwards</b>; " +
    "click it again to fold them back. <b>Click a fact</b> to read it." }));

  const wrap = el("div", { className: "graphwrap" });
  wrap.append(el("canvas", { id: "graph" }));
  m.append(wrap);
  requestAnimationFrame(() => drawGraph($("#graph", wrap), wrap, s));
}

/* A two-level graph.
 *
 * Group nodes are placed deterministically on a ring and do not drift: a top level that
 * rearranges itself every time you open something is impossible to build a mental map of.
 * Opening a group fans its members OUTWARD, away from the centre, so they never land in
 * among the other groups. Only members open the sheet; a group click just opens or folds. */
function drawGraph(canvas, wrap, s) {
  const factBySlug = new Map(s.facts.map((f) => [f.slug, f]));
  const kindOf = (id) => factBySlug.has(id) ? "fact"
    : id.startsWith("#") ? "issue" : s.notes.includes(id) ? "note" : "file";
  const groupOf = (id) => {
    const f = factBySlug.get(id);
    if (f) return f.section || "Ungrouped";
    const k = kindOf(id);
    return k === "note" ? "Notes" : k === "issue" ? "Issues" : "Files";
  };

  const ids = new Set(s.facts.map((f) => f.slug));
  for (const l of s.links) { ids.add(l.from); ids.add(l.to); }

  const members = new Map();
  for (const id of ids) {
    const g = groupOf(id);
    if (!members.has(g)) members.set(g, []);
    members.get(g).push(id);
  }
  const groups = [...members.keys()].sort((a, b) => members.get(b).length - members.get(a).length);

  const PALETTE = ["#7cc7a4","#7aa2f7","#c99bd6","#d8a657","#6fc3c9","#e07b7b","#b3c46b","#e0a1c0","#9d9ff5","#8fb0d9"];
  const colour = new Map(groups.map((g, i) => [g, PALETTE[i % PALETTE.length]]));

  // The ring grows with the number of groups so they never crowd, and each group keeps its
  // angle for the life of the view. That angle is also the direction its members fan out in.
  const RING = Math.max(340, groups.length * 84);
  // Each group owns one slice of the circle. A fan wider than its own slice sweeps across
  // the neighbours, which is exactly what it was doing.
  const SECTOR = (Math.PI * 2) / groups.length;
  const groupNodes = new Map(groups.map((g, i) => {
    const angle = (i / groups.length) * Math.PI * 2 - Math.PI / 2;
    return [g, { id: g, group: g, isGroup: true, angle, count: members.get(g).length,
                 x: Math.cos(angle) * RING, y: Math.sin(angle) * RING, vx: 0, vy: 0, pinned: true }];
  }));

  const radius = (n) => n.isGroup ? 16 + Math.sqrt(n.count) * 3.6 : 5.5;

  /* Fan a group's members outward along its own angle, in shells, so a big group becomes a
     wedge pointing away from the middle rather than a ball sitting on its neighbours. */
  function fanAnchor(g, i) {
    const gn = groupNodes.get(g);
    const n = members.get(g).length;
    const perShell = Math.max(4, Math.ceil(Math.sqrt(n) * 1.15));
    const shell = Math.floor(i / perShell);
    const inShell = i % perShell;
    const count = Math.min(perShell, n - shell * perShell);
    // Never wider than the group's own slice, so one fan can never reach into another.
    const spread = SECTOR * 0.66;
    const t = count === 1 ? 0 : (inShell / (count - 1) - 0.5) * spread;
    const a = gn.angle + t;
    // Well clear of the ring, and each shell steps a long way further out.
    const r = RING + radius(gn) + 210 + shell * 96;
    return { x: Math.cos(a) * r, y: Math.sin(a) * r };
  }

  const memberNodes = new Map();
  for (const g of groups) {
    members.get(g).forEach((id, i) => {
      const gn = groupNodes.get(g);
      memberNodes.set(id, { id, group: g, isGroup: false, kind: kindOf(id),
        x: gn.x, y: gn.y, vx: 0, vy: 0, home: fanAnchor(g, i), pinned: false });
    });
  }

  const expanded = new Set();
  const hidden = new Set();
  const resolve = (id) => (expanded.has(groupOf(id)) ? memberNodes.get(id) : groupNodes.get(groupOf(id)));
  // Group nodes stay on screen when open, as a hollow marker, so there is always something
  // to click to fold them back.
  const shown = () => groups.filter((g) => !hidden.has(g))
    .flatMap((g) => (expanded.has(g) ? [groupNodes.get(g), ...members.get(g).map((id) => memberNodes.get(id))] : [groupNodes.get(g)]));

  function activeEdges() {
    const acc = new Map();
    for (const l of s.links) {
      const a = resolve(l.from), b = resolve(l.to);
      if (!a || !b || a === b) continue;
      if (hidden.has(a.group) || hidden.has(b.group)) continue;
      const key = a.id < b.id ? a.id + "␀" + b.id : b.id + "␀" + a.id;
      const e = acc.get(key) ?? { a, b, weight: 0, authored: 0 };
      e.weight++; if (!l.inferred) e.authored++;
      acc.set(key, e);
    }
    return [...acc.values()];
  }

  let edges = [];
  let alpha = 1;
  const degree = new Map();
  function recompute() {
    edges = activeEdges();
    degree.clear();
    for (const e of edges) {
      degree.set(e.a, (degree.get(e.a) ?? 0) + e.weight);
      degree.set(e.b, (degree.get(e.b) ?? 0) + e.weight);
    }
    alpha = 1;
  }
  const neighbours = (n) => edges.filter((e) => e.a === n || e.b === n).map((e) => (e.a === n ? e.b : e.a));

  function toggle(g) {
    if (expanded.has(g)) {
      expanded.delete(g);
      // Fold members back to their group so reopening reads as unfolding, not teleporting.
      for (const id of members.get(g)) {
        const mn = memberNodes.get(id), gn = groupNodes.get(g);
        mn.x = gn.x; mn.y = gn.y; mn.vx = mn.vy = 0; mn.pinned = false;
      }
      if (selected && groupOf(selected.id) === g) { selected = null; paintSheet(); }
    } else {
      expanded.add(g);
    }
    recompute();
  }

  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  let tx = 0, ty = 0, scale = 0.8;
  let selected = null, hover = null, drag = null, panning = false, lx = 0, ly = 0, moved = 0;
  const ctx = canvas.getContext("2d");

  const search = el("input", { type: "search", placeholder: "Find a fact..." });
  search.oninput = () => {
    const q = search.value.trim().toLowerCase();
    if (!q) return;
    const id = [...ids].find((x) => x.toLowerCase().includes(q));
    if (!id) return;
    if (!expanded.has(groupOf(id))) toggle(groupOf(id));
    selected = memberNodes.get(id);
    centreOn(selected);
    paintSheet();
  };
  wrap.append(el("div", { className: "gtools" }, [
    search,
    el("button", { textContent: "open all", onclick: () => { for (const g of groups) if (!expanded.has(g)) toggle(g); } }),
    el("button", { textContent: "close all", onclick: () => { for (const g of [...expanded]) toggle(g); } }),
    el("button", { textContent: "fit", onclick: fit }),
  ]));

  const legend = el("div", { className: "legend" });
  for (const g of groups) {
    const row = el("div", { className: "on" });
    row.innerHTML = '<i style="background:' + colour.get(g) + '"></i>' +
      esc(g.length > 26 ? g.slice(0, 25) + "..." : g) +
      ' <b style="color:var(--ink-faint);font-weight:400">' + members.get(g).length + "</b>";
    row.onclick = () => {
      hidden.has(g) ? hidden.delete(g) : hidden.add(g);
      row.className = hidden.has(g) ? "" : "on";
      recompute();
    };
    legend.append(row);
  }
  wrap.append(legend);

  /* The sheet is for facts only. A group click expands; it never opens a panel. */
  let sheet = null;
  function paintSheet() {
    sheet?.remove();
    sheet = null;
    if (!selected || selected.isGroup) return;
    const n = selected;
    const f = factBySlug.get(n.id);
    sheet = el("aside", { className: "sheet" });
    sheet.append(el("button", { className: "x", textContent: "✕",
      onclick: () => { selected = null; paintSheet(); } }));
    sheet.insertAdjacentHTML("beforeend",
      '<div class="skind" style="color:' + colour.get(n.group) + '">' + esc(n.group) + "</div>" +
      "<h4>" + esc(n.id) + "</h4>" +
      (f ? "<p>" + inline(f.statement) + "</p>" +
           (f.consequence ? '<p class="so"><b>So:</b> ' + inline(f.consequence) + "</p>" : "")
         : '<p class="meta">' + esc(n.kind) + " referenced by this brain</p>"));

    const links = neighbours(n);
    if (links.length) {
      sheet.append(el("div", { className: "sect", style: "padding:16px 0 4px", textContent: links.length + " linked" }));
      for (const other of links.slice(0, 20)) {
        sheet.append(el("button", { className: "lk", textContent: other.id, onclick: () => {
          if (other.isGroup) { if (!expanded.has(other.id)) toggle(other.id); return; }
          selected = other; centreOn(other); paintSheet();
        } }));
      }
    }
    const row = el("div", { className: "row", style: "margin-top:18px" });
    if (f) row.append(el("button", { className: "lk", style: "width:auto", textContent: "open in memory",
      onclick: () => { query = n.id; view = "memory"; render(); } }));
    if (n.kind === "note") row.append(el("button", { className: "lk", style: "width:auto", textContent: "open note",
      onclick: () => { openFile = "memory/notes/" + n.id; view = "brain"; render(); } }));
    sheet.append(row);
    wrap.append(sheet);
  }

  function size() {
    const r = canvas.getBoundingClientRect();
    const dpr = devicePixelRatio || 1;
    canvas.width = r.width * dpr; canvas.height = r.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return r;
  }
  let rect = size();
  addEventListener("resize", () => { rect = size(); });

  function centreOn(n) { tx = -n.x * scale; ty = -n.y * scale; }
  function fit() {
    const vis = shown();
    if (!vis.length) return;
    const xs = vis.map((n) => n.x), ys = vis.map((n) => n.y);
    const minx = Math.min(...xs), miny = Math.min(...ys);
    const w = Math.max(...xs) - minx || 1, h = Math.max(...ys) - miny || 1;
    scale = Math.min(1.6, Math.max(0.12, Math.min(rect.width / (w + 260), rect.height / (h + 260))));
    tx = -(minx + w / 2) * scale;
    ty = -(miny + h / 2) * scale;
  }

  function step() {
    if (alpha < 0.004) return;
    alpha *= 0.988;
    const vis = shown();
    const loose = vis.filter((n) => !n.isGroup);

    // Only members are simulated. Groups hold the frame.
    for (let i = 0; i < loose.length; i++) {
      const a = loose[i];
      for (let j = i + 1; j < loose.length; j++) {
        const b = loose[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d2 = dx * dx + dy * dy || 0.01;
        if (d2 > 40000) continue;
        const d = Math.sqrt(d2);
        const overlap = radius(a) + radius(b) + 15 - d;
        const f = 900 / d2 + (overlap > 0 ? overlap * 0.42 : 0);
        const ux = dx / d, uy = dy / d;
        a.vx -= ux * f; a.vy -= uy * f; b.vx += ux * f; b.vy += uy * f;
      }
      // Keep clear of every group node, so a fan never drifts back over the ring.
      for (const g of groups) {
        const gn = groupNodes.get(g);
        const dx = a.x - gn.x, dy = a.y - gn.y;
        const d = Math.hypot(dx, dy) || 0.01;
        const gap = radius(gn) + 26;
        if (d < gap) { const f = (gap - d) * 0.5; a.vx += (dx / d) * f; a.vy += (dy / d) * f; }
      }
    }
    for (const e of edges) {
      // Only members of the same group attract. A cross-group spring drags a fact out of its
      // own fan and across the picture, which is most of what made this unreadable.
      if (e.a.isGroup || e.b.isGroup || e.a.group !== e.b.group) continue;
      const dx = e.b.x - e.a.x, dy = e.b.y - e.a.y;
      const d = Math.hypot(dx, dy) || 0.01;
      const f = (d - 120) * 0.004;
      const ux = dx / d, uy = dy / d;
      e.a.vx += ux * f; e.a.vy += uy * f; e.b.vx -= ux * f; e.b.vy -= uy * f;
    }
    for (const n of loose) {
      // The fan position is the strong term: it is what keeps a group's facts together and
      // out on their own side of the picture.
      n.vx += (n.home.x - n.x) * 0.09;
      n.vy += (n.home.y - n.y) * 0.09;
      if (n.pinned || n === drag) { n.vx = n.vy = 0; continue; }
      n.x += (n.vx *= 0.72); n.y += (n.vy *= 0.72);
    }
  }

  function draw() {
    if (!document.body.contains(canvas)) return;
    step();
    ctx.clearRect(0, 0, rect.width, rect.height);
    ctx.save();
    ctx.translate(rect.width / 2 + tx, rect.height / 2 + ty);
    ctx.scale(scale, scale);

    const near = selected ? new Set([selected, ...neighbours(selected)]) : null;
    const labelBoxes = [];

    // A faint spoke from an open group to its own fan, so the ownership is obvious.
    for (const g of groups) {
      if (!expanded.has(g) || hidden.has(g)) continue;
      const gn = groupNodes.get(g);
      ctx.strokeStyle = colour.get(g); ctx.globalAlpha = 0.14;
      ctx.lineWidth = 1 / scale;
      for (const id of members.get(g)) {
        const mn = memberNodes.get(id);
        ctx.beginPath(); ctx.moveTo(gn.x, gn.y); ctx.lineTo(mn.x, mn.y); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;

    for (const e of edges) {
      const lit = !near || (near.has(e.a) && near.has(e.b));
      ctx.strokeStyle = near && lit ? css("--accent") : css("--line");
      ctx.globalAlpha = near ? (lit ? 0.95 : 0.07) : 0.62;
      ctx.lineWidth = Math.min(6, 0.8 + Math.log2(e.weight + 1) * 1.25) / Math.max(1, scale * 0.8);
      ctx.beginPath(); ctx.moveTo(e.a.x, e.a.y); ctx.lineTo(e.b.x, e.b.y); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    const painted = shown().sort((a, b) => (b.isGroup ? b.count : 0) - (a.isGroup ? a.count : 0));
    for (const n of painted) {
      const r = radius(n);
      const dim = near && !near.has(n);
      ctx.globalAlpha = dim ? 0.13 : 1;

      if (n.isGroup) {
        const open = expanded.has(n.id);
        ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 7);
        if (open) {
          // Hollow while open: the group is still here, and still the thing you click to fold.
          ctx.fillStyle = css("--panel"); ctx.fill();
          ctx.strokeStyle = colour.get(n.group); ctx.lineWidth = 2.4 / scale; ctx.stroke();
          ctx.fillStyle = colour.get(n.group);
        } else {
          ctx.fillStyle = colour.get(n.group); ctx.fill();
          ctx.fillStyle = css("--bg");
        }
        ctx.font = "600 " + Math.max(9, r * 0.6) + "px ui-monospace,monospace";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(String(n.count), n.x, n.y + 0.5);
        ctx.textBaseline = "alphabetic";
        const text = n.id.length > 24 ? n.id.slice(0, 23) + "..." : n.id;
        const fs = Math.max(10, 12 / scale);
        ctx.font = "600 " + fs + "px -apple-system,system-ui,sans-serif";
        const w = ctx.measureText(text).width;
        const bx = n.x - w / 2, by = n.y + r + 6, bh = fs * 1.25;
        const clashes = labelBoxes.some((o) =>
          bx < o.x + o.w + 8 && bx + w + 8 > o.x && by < o.y + o.h + 4 && by + bh + 4 > o.y);
        if (!clashes || n === hover) {
          labelBoxes.push({ x: bx, y: by, w, h: bh });
          ctx.textAlign = "center";
          ctx.fillStyle = css(n === hover ? "--ink" : "--ink-dim");
          ctx.fillText(text, n.x, by + fs);
        }
        ctx.textAlign = "left";
      } else {
        ctx.fillStyle = colour.get(n.group) ?? css("--ink-faint");
        ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 7); ctx.fill();
        if (n === selected || n === hover || scale > 1.05) {
          ctx.fillStyle = css(n === selected || n === hover ? "--ink" : "--ink-dim");
          ctx.font = Math.max(9, 10.5 / scale) + "px ui-monospace,monospace";
          ctx.fillText(n.id.length > 26 ? n.id.slice(0, 25) + "..." : n.id, n.x + r + 4, n.y + 3.5);
        }
      }
      if (n === selected || n === hover) {
        ctx.globalAlpha = 1;
        ctx.strokeStyle = css("--ink"); ctx.lineWidth = 1.5 / scale;
        ctx.beginPath(); ctx.arc(n.x, n.y, r + 4, 0, 7); ctx.stroke();
      }
    }
    ctx.restore();
    requestAnimationFrame(draw);
  }
  recompute();
  fit();
  draw();

  const toWorld = (ev) => {
    const r = canvas.getBoundingClientRect();
    return { x: (ev.clientX - r.left - r.width / 2 - tx) / scale,
             y: (ev.clientY - r.top - r.height / 2 - ty) / scale };
  };
  const at = (ev) => {
    const p = toWorld(ev);
    // Members first: an open group's node must never swallow a click meant for a fact.
    const vis = shown();
    return vis.filter((n) => !n.isGroup).find((n) => Math.hypot(n.x - p.x, n.y - p.y) < radius(n) + 6)
        ?? vis.filter((n) => n.isGroup).find((n) => Math.hypot(n.x - p.x, n.y - p.y) < radius(n) + 5);
  };

  canvas.onpointerdown = (ev) => {
    canvas.setPointerCapture?.(ev.pointerId);
    moved = 0; lx = ev.clientX; ly = ev.clientY;
    const n = at(ev);
    if (n) { drag = n; if (!n.isGroup) n.pinned = true; alpha = Math.max(alpha, 0.3); }
    else { panning = true; canvas.classList.add("grabbing"); }
  };
  canvas.onpointermove = (ev) => {
    moved += Math.abs(ev.clientX - lx) + Math.abs(ev.clientY - ly);
    if (drag) { const p = toWorld(ev); drag.x = p.x; drag.y = p.y; drag.vx = drag.vy = 0; }
    else if (panning) { tx += ev.clientX - lx; ty += ev.clientY - ly; }
    else {
      const h = at(ev);
      if (h !== hover) { hover = h; canvas.classList.toggle("onnode", !!h); }
    }
    lx = ev.clientX; ly = ev.clientY;
  };
  canvas.onpointerup = (ev) => {
    canvas.releasePointerCapture?.(ev.pointerId);
    if (moved < 4) {
      const n = at(ev);
      if (!n) { selected = null; paintSheet(); }
      else if (n.isGroup) toggle(n.id);        // groups only ever open or fold
      else { selected = n === selected ? null : n; paintSheet(); }
    }
    drag = null; panning = false;
    canvas.classList.remove("grabbing");
  };
  canvas.ondblclick = (ev) => { const n = at(ev); if (n && !n.isGroup) { n.pinned = false; alpha = Math.max(alpha, 0.4); } };
  canvas.onwheel = (ev) => {
    ev.preventDefault();
    scale = Math.min(3.5, Math.max(0.1, scale * (ev.deltaY < 0 ? 1.12 : 0.89)));
  };
}

/* -------------------------------- brain ------------------------------- */
function viewBrain(m) {
  const s = staff();
  m.append(el("h1", { textContent: s.name + " · brain" }));
  m.append(el("p", { className: "sub", textContent:
    "Every file this staff member holds, grouped by the surfaces their manifest declares." }));

  const filter = el("input", { type: "search", placeholder: "Filter files…", value: fileQuery });
  const count = el("span", { className: "meta" });
  m.append(el("div", { className: "row", style: "margin-bottom:16px" }, [filter, count]));

  const split = el("div", { className: "split" });
  const tree = el("div", { className: "tree" });
  const viewer = el("div", { className: "viewer" });
  split.append(tree, viewer);
  m.append(split);

  filter.oninput = () => { fileQuery = filter.value; writeHash(false); paintTree(); };
  paintTree();

  function paintTree() {
  const q = fileQuery.trim().toLowerCase();
  tree.replaceChildren();
  let shown = 0, total = 0;
  for (const surface of s.surfaces) {
    const files = surface.files.filter((f) => !q || f.path.toLowerCase().includes(q));
    total += surface.files.length;
    shown += files.length;
    if (!files.length) continue;
    tree.append(el("div", { className: "tdir", textContent: surface.path + "  (" + surface.render + ")" }));
    if (surface.render === "gallery" && !q) {
      const b = el("button", { className: "tfile", textContent: "◹ view gallery" });
      b.onclick = () => showGallery(viewer, s, surface);
      tree.append(b);
    }
    for (const f of files.slice(0, 400)) {
      const b = el("button", { className: "tfile", title: f.path });
      b.append(f.path.replace(surface.path, ""));
      b.append(el("i", { textContent: kb(f.bytes) }));
      b.setAttribute("aria-current", String(openFile === f.path));
      b.onclick = () => { openFile = f.path; writeHash(false); show(viewer, s, f); for (const o of tree.querySelectorAll(".tfile")) o.setAttribute("aria-current", "false"); b.setAttribute("aria-current", "true"); };
      tree.append(b);
    }
  }
  count.textContent = q ? shown + " of " + total + " files" : total + " files";
  if (!shown) tree.append(el("p", { className: "empty", textContent: "Nothing matches." }));
  }

  const initial = s.surfaces.flatMap((x) => x.files).find((f) => f.path === openFile);
  if (initial) show(viewer, s, initial);
  else viewer.append(el("p", { className: "empty", textContent: "Pick a file." }));
}

const kb = (n) => n < 1024 ? n + "b" : n < 1048576 ? Math.round(n / 1024) + "k" : (n / 1048576).toFixed(1) + "M";
const IMG = ["png", "jpg", "jpeg", "gif", "svg", "webp", "ico"];

async function show(viewer, s, f) {
  viewer.replaceChildren(el("p", { className: "empty", textContent: "Loading…" }));
  const url = "/api/file?path=" + encodeURIComponent(s.dir + "/" + f.path);
  const head = el("div", { className: "meta", style: "margin-bottom:12px" },
    [f.path + " · " + kb(f.bytes) + " · " + new Date(f.modified).toLocaleDateString()]);

  if (IMG.includes(f.ext)) {
    viewer.replaceChildren(head, el("img", { src: url, alt: f.path }));
    return;
  }
  const text = await (await fetch(url)).text();
  if (f.ext === "csv") { viewer.replaceChildren(head, csvTable(text)); return; }
  viewer.replaceChildren(head, el("pre", { textContent: text }));
}

function csvTable(text) {
  const rows = text.trim().split("\n").slice(0, 300).map((r) => r.split(","));
  const t = el("table");
  const [head, ...body] = rows;
  t.append(el("tr", {}, (head ?? []).map((h) => el("th", { textContent: h }))));
  for (const r of body) t.append(el("tr", {}, r.map((c) => el("td", { textContent: c }))));
  return t;
}

function showGallery(viewer, s, surface) {
  const imgs = surface.files.filter((f) => IMG.includes(f.ext));
  if (!imgs.length) { viewer.replaceChildren(el("p", { className: "empty", textContent: "No images here." })); return; }
  const g = el("div", { className: "gallery" });
  for (const f of imgs.slice(0, 200)) {
    const fig = el("figure");
    const img = el("img", { src: "/api/file?path=" + encodeURIComponent(s.dir + "/" + f.path), loading: "lazy", alt: f.path });
    img.onclick = () => show(viewer, s, f);
    fig.append(img, el("figcaption", { textContent: f.path.split("/").pop() }));
    g.append(fig);
  }
  viewer.replaceChildren(el("div", { className: "meta", style: "margin-bottom:12px" }, [imgs.length + " images in " + surface.path]), g);
}

/* ------------------------------- changed ------------------------------ */
function viewChanged(m) {
  const s = staff();
  m.append(el("h1", { textContent: s.handle.toUpperCase() + " · what changed" }));
  m.append(el("p", { className: "sub", textContent:
    "What this agent learned and forgot. Click any row to see the diff that did it." }));

  const filter = el("input", { type: "search", placeholder: "Filter by slug or commit…", value: changedQuery });
  const only = el("select");
  only.append(el("option", { value: "", textContent: "Everything" }),
              el("option", { value: "added", textContent: "Learned" }),
              el("option", { value: "removed", textContent: "Forgotten" }));
  only.value = changedFilter;
  m.append(el("div", { className: "row", style: "margin-bottom:16px" }, [filter, only]));

  const split = el("div", { className: "split" });
  const list = el("div", { className: "tree" });
  const viewer = el("div", { className: "viewer" });
  split.append(list, viewer);
  m.append(split);
  viewer.append(el("p", { className: "empty", textContent: "Pick a change." }));

  filter.oninput = () => { changedQuery = filter.value; writeHash(false); paint(); };
  only.onchange = () => { changedFilter = only.value; paint(); };
  paint();

  function paint() {
    const q = changedQuery.trim().toLowerCase();
    list.replaceChildren();

    const facts = s.factsChanged.filter((c) =>
      (!changedFilter || c.change === changedFilter) &&
      (!q || (c.slug + " " + c.sha).toLowerCase().includes(q)));

    if (facts.length) {
      const byDay = new Map();
      for (const c of facts) {
        const d = c.date.slice(0, 10);
        if (!byDay.has(d)) byDay.set(d, []);
        byDay.get(d).push(c);
      }
      for (const [day, items] of byDay) {
        list.append(el("div", { className: "tdir", textContent: day }));
        for (const c of items) {
          const b = el("button", { className: "tfile" });
          b.innerHTML = '<span class="' + (c.change === "added" ? "ok" : "err") + '">' +
            (c.change === "added" ? "+" : "−") + "</span> " + esc(c.slug) + "<i>" + esc(c.sha) + "</i>";
          b.onclick = () => { markCurrent(list, b); showDiff(viewer, s, c.sha, "memory/INDEX.md", c.slug); };
          list.append(b);
        }
      }
    }

    const commits = s.recentCommits.filter((c) => !q || (c.subject + " " + c.sha).toLowerCase().includes(q));
    if (commits.length && !changedFilter) {
      list.append(el("div", { className: "tdir", textContent: "commits" }));
      for (const c of commits.slice(0, 25)) {
        const b = el("button", { className: "tfile", title: c.subject });
        b.append(c.subject.slice(0, 44));
        b.append(el("i", { textContent: c.sha }));
        b.onclick = () => { markCurrent(list, b); showDiff(viewer, s, c.sha, "", null); };
        list.append(b);
      }
    }

    if (!list.children.length) list.append(el("p", { className: "empty", textContent: "Nothing matches." }));
  }
}

function markCurrent(list, btn) {
  // Rows are .tfile in the file tree and .irow in the inbox. Matching only one of them is
  // how every clicked row stayed selected.
  for (const o of list.querySelectorAll('[aria-current="true"]')) o.setAttribute("aria-current", "false");
  btn.setAttribute("aria-current", "true");
}

async function showDiff(viewer, s, sha, path, highlight) {
  viewer.replaceChildren(el("p", { className: "empty", textContent: "Loading diff…" }));
  const url = "/api/diff?dir=" + encodeURIComponent(s.dir) + "&sha=" + encodeURIComponent(sha) +
              (path ? "&path=" + encodeURIComponent(path) : "");
  const res = await fetch(url);
  if (!res.ok) { viewer.replaceChildren(el("p", { className: "empty err", textContent: "Could not load that diff." })); return; }
  const text = await res.text();

  // The first line is author\x1fdate\x1fsubject, prepended by the endpoint.
  const nl = text.indexOf("\n");
  const [author, date, subject] = text.slice(0, nl).split("\x1f");
  const body = text.slice(nl + 1);

  const head = el("div", { style: "margin-bottom:12px" }, [
    el("div", { style: "font-weight:600", textContent: subject ?? sha }),
    el("div", { className: "meta", textContent: sha + " · " + new Date(date).toLocaleString() + " · " + author }),
  ]);

  const pre = el("pre", { className: "diff" });
  for (const line of body.split("\n")) {
    const cls = line.startsWith("+++") || line.startsWith("---") ? "dmeta"
      : line.startsWith("@@") ? "dhunk"
      : line.startsWith("+") ? "dadd"
      : line.startsWith("-") ? "ddel"
      : line.startsWith("diff ") || line.startsWith("index ") ? "dmeta" : "";
    const row = el("span", { className: "dline " + cls, textContent: line + "\n" });
    if (highlight && line.includes("`" + highlight + "`")) row.classList.add("dfocus");
    pre.append(row);
  }
  viewer.replaceChildren(head, pre);
  const focus = pre.querySelector(".dfocus");
  if (focus) focus.scrollIntoView({ block: "center" });
}

/* -------------------------------- health ------------------------------ */
function viewHealth(m) {
  const s = staff();
  m.append(el("h1", { textContent: s.name + " · health" }));
  const errs = s.problems.filter((p) => p.level === "error");
  const warns = s.problems.filter((p) => p.level === "warning");
  m.append(el("p", { className: "sub", innerHTML:
    "<span class='" + (errs.length ? "err" : "ok") + "'>" + errs.length + " errors</span> · " +
    "<span class='warn'>" + warns.length + " warnings</span> · same checks as <code>roster lint</code>." }));

  const authored = s.links.filter((l) => !l.inferred).length;
  const g = el("div", { className: "grid", style: "margin-bottom:20px" });
  for (const [n, label] of [[s.facts.length, "facts"], [s.notes.length, "notes"],
                            [authored, "authored links"], [s.links.length - authored, "inferred links"]]) {
    g.append(el("div", { className: "stat" }, [el("b", { textContent: n }), el("span", { textContent: label })]));
  }
  m.append(g);

  if (!s.problems.length) { m.append(el("p", { className: "empty", textContent: "Nothing to fix." })); return; }
  for (const p of s.problems) {
    const d = el("div", { className: "card" });
    d.innerHTML = '<div class="row"><span class="' + (p.level === "error" ? "err" : "warn") +
      '" style="font:11px var(--mono)">' + p.level + "</span>" +
      '<span class="pill">' + esc(p.rule) + "</span>" +
      (p.line ? '<span class="meta">INDEX.md:' + p.line + "</span>" : "") + "</div>" +
      '<p style="margin:8px 0 0">' + inline(p.message) + "</p>";
    m.append(d);
  }
}

/* Three states on purpose: "system" is the default and has to be reachable again after
   someone has tried both others. */
const THEMES = ["system", "light", "dark"];
function store(k, v) { try { return v === undefined ? localStorage.getItem(k) : localStorage.setItem(k, v); } catch { return null; } }
function applyTheme(name) {
  if (name === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", name);
  const b = $("#theme");
  if (b) b.replaceChildren("Theme", el("span", { className: "n", textContent: name }));
}
function initTheme() {
  let theme = store("roster.theme") ?? "system";
  if (!THEMES.includes(theme)) theme = "system";
  applyTheme(theme);
  const b = $("#theme");
  if (b) b.onclick = () => {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    store("roster.theme", theme);
    applyTheme(theme);
  };
}
initTheme();

boot().catch((e) => { $("#main").innerHTML = '<p class="empty err">' + esc(e.message) + "</p>"; });
